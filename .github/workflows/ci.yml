name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # The integration tests start Postgres and RabbitMQ through
      # Testcontainers, so the runner's Docker daemon is the only service
      # dependency the job has.
      - name: Build and test
        run: ./mvnw -B verify

      - name: Build the image
        run: docker build -t catalog-sync:${{ github.sha }} .
